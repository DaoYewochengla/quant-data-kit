[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-data-kit"
version = "0.1.0"
description = "中国市场公开行情数据的采集与整理工具（纯数据工程，不含策略/因子/选股规则/投资建议）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["akshare", "a-share", "market-data", "convertible-bond", "etf", "data-pipeline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Financial and Insurance Industry",
]
dependencies = [
    "akshare>=1.15",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
qdk = "qdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qdk = ["py.typed"]
